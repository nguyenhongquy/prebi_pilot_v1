[project]
name = "prebi-segment-classification"
version = "0.1.0"
description = "GBERT baselines for German reflection segment classification"
requires-python = ">=3.11,<3.15"
dependencies = [
    "ipykernel>=7.0",
    "langchain-core>=0.3",
    "langsmith>=0.3",
    "matplotlib>=3.9",
    "nbformat>=5.9",
    "pandas>=2.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "tqdm>=4.66",
    "transformers>=4.46,<5",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=2.0"]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
